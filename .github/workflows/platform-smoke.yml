name: Short platform smoke
on:
  push:
    branches: [codex/vscode-extension]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: extension
      - id: core
        run: node extension/scripts/ci/core-ref.cjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: edigonzales/interlis-java
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 25.0.3
      - run: npm ci --ignore-scripts
        working-directory: extension
      - name: Build locked packages under the macOS Python guard
        run: node core/tools/verification/without-python.cjs node "$GITHUB_WORKSPACE/extension/scripts/ci/build-smokes.cjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-packages
          if-no-files-found: error
          retention-days: 14
          path: |
            extension/build/packages/*.vsix
            extension/build/packages/*.inventory.json
            extension/build/ci/build-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-guard
          path: core/build/reports/python-free/environment.json
  smoke:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: platform-packages
          path: build/download
      - name: Prepare package inputs
        shell: bash
        run: |
          mkdir -p build/packages
          cp build/download/packages/* build/packages/
          cp build/download/ci/build-provenance.json build/packages/
      - name: Native runtime, stdio, Unicode CLI installation and rejection smoke
        run: node scripts/ci/smoke.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ci/smoke-*/result.json
            build/ci/smoke-*/command-*.log
