name: Publish Open VSX preview

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/platform-smoke.yml
    with:
      prerelease: true

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: platform-packages
          path: packages
      - name: Publish the tested platform packages
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSIX_MARKETPLACE_TOKEN }}
        run: |
          : "${OVSX_PAT:?Configure the OPEN_VSIX_MARKETPLACE_TOKEN repository secret}"
          targets=(linux-x64 win32-x64 darwin-arm64)
          for target in "${targets[@]}"; do
            test -s "packages/validated-$target/interlis-editor-$target.vsix"
          done
          for target in "${targets[@]}"; do
            npx --yes ovsx@1.3.0 publish --skip-duplicate "packages/validated-$target/interlis-editor-$target.vsix"
          done
          printf '[INTERLIS Editor 0.1.%s on Open VSX](https://open-vsx.org/extension/edigonzales/interlis-editor/0.1.%s)\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
